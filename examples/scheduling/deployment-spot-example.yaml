apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-workload-example
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spot-workload-example
  template:
    metadata:
      labels:
        app: spot-workload-example
    spec:
      nodeSelector:
        workload_tier: spot
      tolerations:
        - key: workload-tier
          operator: Equal
          value: spot
          effect: NoSchedule
      containers:
        - name: app
          image: public.ecr.aws/docker/library/nginx:stable
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
