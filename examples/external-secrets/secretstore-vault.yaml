apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: default
spec:
  provider:
    vault:
      server: https://vault.example.com # change to your Vault URL
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes # change if your auth mount differs
          role: external-secrets # Vault role bound to this service account
          serviceAccountRef:
            name: external-secrets
