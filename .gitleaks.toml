title = "terraform-labs gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore generated/downloaded Terraform module caches"
paths = [
  '''^\.external_modules/''',
  '''^infra/\.external_modules/''',
  '''^infra/\.terraform/''',
  '''^infra/\.terraform-ci/''',
  '''^modules/[^/]+/\.terraform/''',
  '''^modules/[^/]+/\.terraform-ci/''',
]
